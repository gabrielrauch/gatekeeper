[server]
listen = "0.0.0.0:8080"
upstream_url = "http://localhost:3000"

[server.proxy]
connect_timeout = "5s"
request_timeout = "30s"

[defaults]
algorithm = "token_bucket"
capacity = 100
refill_rate = 10.0
cost = 1
fail_mode = "open"

[store.memory]
max_entries = 1_000_000
eviction_interval = "60s"
